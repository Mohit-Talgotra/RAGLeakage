# RQ4: metadata ablation, pre-filter on/off, with scores over authorized chunks only (audit C3).
name: p4_ablation_existence
experiment: existence
seeds: 5
base:
  embedder: all-MiniLM-L6-v2
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  corpus: synthetic_v3@seed
  preset: full
  exposure: with_reranker
  attackers: [insider, outsider]
  victim_warmup: 0.5
  sync: live
  targets_per_tenant: 12
  llm_backend: stub
grid:
  acl_prefilter: [true, false]
  ablate: [none, score_quantize, uniform_refusal, latency_pad, cache_lazy_check]
variants:
  - {variant: as_is}
  - {variant: fast_refusal, fast_refusal: true}
  - {variant: pad30, pad_strategy: floor, pad_ms: 30.0}
  - {variant: deadline2s, pad_strategy: deadline, pad_ms: 2000.0}
  - {variant: withheld_scores, expose_withheld_scores: true}
