# RQ2: how long does leakage last? ACL sync policy x memory retention x time since last use.
# memory_ttl_s 0 = no session expiry (the old testbed); revoke_gap_s = time from the victim's
# last use of the document to the revocation (leakage is conditional on recent use).
name: p2_lifetimes
experiment: revocation
seeds: 5
base:
  embedder: all-MiniLM-L6-v2
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  corpus: synthetic_v3@seed
  preset: baseline
  cache_ttl_s: 3600
  events: 40
  probe_readonly: true
  probe_unseen: true
  probe_paraphrase: file
  probe_times: [0, 60, 600, 1800, 3600, 7200, 14400, 28800, 43200, 64800, 86400, 129600, 172800]
  llm_backend: ollama
  llm_model: llama3.1:8b
  summarizer: llm
grid:
  sync: [periodic:3600, periodic:86400, event:0.0, event:0.05:86400]
  memory_ttl_s: [0, 3600, 86400]
  revoke_gap_s: [[0, 600], [3600, 7200], [86400, 90000]]
