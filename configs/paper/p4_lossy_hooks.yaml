# Eager hooks miss events (re-audit N4): 5% of webhooks to the index and 5% of the cache and
# memory revocation hooks are lost. Read-time checks (epoch, full's lazy check) cannot miss an
# event; flush can.
name: p4_lossy_hooks
experiment: revocation
seeds: 5
base:
  embedder: all-MiniLM-L6-v2
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  corpus: synthetic_v3@seed
  sync: event:0.05:86400
  hook_drop: 0.05
  events: 40
  warm_restricted: 2
  probe_readonly: true
  probe_unseen: true
  probe_paraphrase: file
  probe_times: [0, 600, 3600, 14400, 43200, 86400, 172800]
  llm_backend: ollama
  llm_model: llama3.1:8b
  summarizer: llm
grid:
  preset: [flush, epoch, full, full_user]
  revocation_type: [single_doc, role]
