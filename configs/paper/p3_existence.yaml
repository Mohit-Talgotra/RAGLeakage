# RQ3: existence inference on the generated corpus. Insiders and outsiders reported separately;
# every v3 target has a sibling. Latency measured on every call (llm_cache: false).
name: p3_existence
experiment: existence
seeds: 5
base:
  embedder: all-MiniLM-L6-v2
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  corpus: synthetic_v3@seed
  exposure: with_reranker
  attackers: [insider, outsider]
  victim_warmup: 0.5
  sync: live
  targets_per_tenant: 12
  llm_backend: ollama
  llm_model: llama3.1:8b
  llm_cache: false
grid:
  preset: [strawman, baseline, baseline_shared, legacy, epoch, full, full_user]
