# Real-LLM check, local only: does post-revocation leakage hold with a real generator?
# Same events as the stub (paired on seed and event), Qwen2.5-7B-Instruct via Ollama
# (ollama pull qwen2.5:7b). Generations are cached under .cache/llm/, so reruns are fast.
name: model_grid_7b
experiment: revocation
seeds: 5
base:
  embedder: all-MiniLM-L6-v2
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  llm_model: qwen2.5:7b
  sync: periodic:86400
  events: 20
grid:
  llm_backend: [stub, ollama]
  preset: [baseline, full]
