# Stub copy of p4_defenses_revocation_enron (validation harness, CPU only): single-document
# revocation, extractive summaries, no paraphrase bank.
name: p_min_defenses_stub
experiment: revocation
seeds: 5
base:
  embedder: all-MiniLM-L6-v2
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  corpus: enron_c
  sync: periodic:86400
  events: 40
  warm_restricted: 2
  probe_retained: true
  probe_readonly: true
  probe_unseen: true
  probe_times: [0, 600, 3600, 14400, 43200, 86400, 172800]
  llm_backend: stub
  stub_sentences: 1
grid:
  preset: [baseline, baseline_shared, authz_prefilter, authz_postfilter, epoch, flush, full]
  revocation_type: [single_doc]
variants:
  - {variant: extractive_summary, summarizer: extractive}
